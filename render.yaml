# ==============================================================================
# EduFlow AI OS — Unified Render Blueprint (render.yaml)
# Full-stack deployment: Express Backend + React Vite SPA + Managed PostgreSQL
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. EduFlow Backend Web Service (Node.js Express API)
  # ----------------------------------------------------------------------------
  - type: web
    name: eduflow-backend
    runtime: node
    plan: starter
    region: singapore
    rootDir: eduflow-backend
    buildCommand: npm ci
    preDeployCommand: bash scripts/migrate-and-seed.sh
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: eduflow-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: eduflow-web
          property: host
      - key: RATE_LIMIT_MAX_AUTH
        value: "100"
      - key: RATE_LIMIT_MAX_UNAUTH
        value: "20"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: LEAD_NOTIFICATION_EMAIL
        value: admin@eduflow.app
      - key: COMPANY_ADDRESS
        value: "Hyderabad, India"
      - key: COMPANY_GST
        value: ""
      - key: BANK_DETAILS
        value: "Contact for bank details"
      - key: APP_PUBLIC_URL
        fromService:
          type: web
          name: eduflow-web
          property: host

  # ----------------------------------------------------------------------------
  # 2. EduFlow Frontend Static Site (React 18 + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: eduflow-web
    runtime: static
    plan: starter
    region: singapore
    rootDir: eduflow-core/web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: eduflow-backend
          property: host
      - key: VITE_DEMO_MODE
        value: "true"

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database (Render Postgres 16)
# ------------------------------------------------------------------------------
databases:
  - name: eduflow-postgres
    plan: starter
    region: singapore
    databaseName: eduflow
    user: eduflow
